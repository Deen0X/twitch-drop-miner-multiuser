version: '3.8'

services:
  twitch-miner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: twitch-miner-multi
    ports:
      - "4295:4295"
    volumes:
      # Mount project directory from disk - changes to code don't require rebuild
      - D:\Develop-AI-OC\Twitch-Miner-multi:C:\app
    environment:
      - APP_NAME=TwitchMinerDeen0X
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    # Run directly from mounted volume (no COPY in Dockerfile for app code)
    command: python C:/app/main.py --web --host 0.0.0.0 --port 4295