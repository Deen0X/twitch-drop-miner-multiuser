<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>Login - Twitch Drops Miner</title>
  <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="/static/dnx-web-ui.css">
  <link rel="stylesheet" href="/static/background.css">
  <style>
    :root { --accent: {{ accent|default('#9147ff') }}; --accent-2: {{ accent_2|default('#772ce8') }}; }
  </style>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('dnx_theme') || 'auto';
        document.documentElement.setAttribute('data-theme', t);
        var b = localStorage.getItem('dnx_bg');
        if (b) {
          try {
            var m = JSON.parse(b);
            if (m && m.mode && m.mode !== 'none' && m.sha) {
              var el = document.documentElement;
              el.setAttribute('data-dnx-bg', m.mode);
              el.style.setProperty('--dnx-bg-url', 'url("/branding/bg?v=' + encodeURIComponent(String(m.sha)) + '")');
              el.style.setProperty('--dnx-bg-intensity', String(Math.max(0, Math.min(100, Number(m.intensity || 6))) / 100));
              if (m.tint && m.tint !== 'auto' && /^#[0-9a-f]{6}$/i.test(m.tint)) {
                el.style.setProperty('--dnx-bg-tint', m.tint);
              }
            } else {
              el.removeAttribute('data-dnx-bg');
              el.style.setProperty('--dnx-bg-intensity', '0');
            }
          } catch (e) {}
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="login-wrap">
    <div class="login">
      <div class="brand">
        <img class="logo" src="/static/logo.png" alt="Logo">
        <div>
          <h1>Twitch Drop Miner</h1>
          <div class="ver">Multiuser Drop</div>
        </div>
      </div>

      {% if error %}<div class="err">{{ error }}</div>{% endif %}

      <form method="post" action="/login" id="loginForm">
        <div class="field">
          <label for="username">Username</label>
          <input type="text" name="username" id="username" required autocomplete="username">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" name="password" id="password" required autocomplete="current-password">
        </div>
        <div class="switch" style="margin:10px 0;">
          <input type="checkbox" name="remember" id="remember" checked>
          <label for="remember"></label>
          <span class="switch-text">Remember me</span>
        </div>
        <button type="submit" class="btn">Login</button>
      </form>

      <div class="foot">By: DNX.Projects</div>
    </div>
  </div>

  <script>
    var savedUsername = localStorage.getItem('tdm_username');
    var savedPassword = localStorage.getItem('tdm_password');
    if (savedUsername) document.getElementById('username').value = savedUsername;
    if (savedPassword) document.getElementById('password').value = savedPassword;
    document.getElementById('loginForm').onsubmit = function () {
      if (document.getElementById('remember').checked) {
        localStorage.setItem('tdm_username', document.getElementById('username').value);
        localStorage.setItem('tdm_password', document.getElementById('password').value);
      } else {
        localStorage.removeItem('tdm_username');
        localStorage.removeItem('tdm_password');
      }
    };
  </script>
  <script>
    if (typeof DnxBg !== 'undefined') DnxBg.load();
  </script>
</body>
</html>
