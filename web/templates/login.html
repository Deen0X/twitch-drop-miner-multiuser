<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twitch Drops Miner - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
    <style>
        body { background: #0e0e11; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { background: #1b1b21; border: 1px solid #2d2d35; border-radius: 12px; padding: 2rem; width: 100%; max-width: 400px; }
        .login-logo { width: 80px; height: 80px; object-fit: contain; margin: 0 auto 15px auto; display: block; }
        .form-control { background: #26262e; border: 1px solid #3d3d45; color: #e0e0e0; }
        .form-control:focus { background: #26262e; border-color: #9147ff; color: #e0e0e0; box-shadow: 0 0 0 0.2rem rgba(145,71,255,0.25); }
        .btn-primary { background: #9147ff; border: none; }
        .btn-primary:hover { background: #772ce8; }
        .error-msg { color: #ff4444; font-size: 0.875rem; }
        .login-footer { text-align: center; margin-top: 20px; font-size: 0.75rem; color: #666; }
    </style>
</head>
<body>
    <div class="login-card">
        <img src="/static/logo.png" class="login-logo" alt="Logo">
        <h3 class="text-center mb-4" style="color: #9147ff;">Twitch Drop Miner<br><small style="font-size: 0.6em; color: #772ce8;">Multiuser Drop</small></h3>
        {% if error %}
        <div class="error-msg text-center mb-3">{{ error }}</div>
        {% endif %}
        <form method="post" action="/login" id="loginForm">
            <div class="mb-3">
                <label class="form-label" style="color: #a0a0a0;">Username</label>
                <input type="text" name="username" id="username" class="form-control" required autocomplete="username">
            </div>
            <div class="mb-3">
                <label class="form-label" style="color: #a0a0a0;">Password</label>
                <input type="password" name="password" id="password" class="form-control" required autocomplete="current-password">
            </div>
            <div class="mb-3 form-check">
                <input type="checkbox" name="remember" class="form-check-input" id="remember" checked>
                <label class="form-check-label" for="remember" style="color: #a0a0a0;">Remember me</label>
            </div>
            <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>
        <div class="login-footer">By: DNX.Projects</div>
    </div>
    <script>
        const savedUsername = localStorage.getItem('tdm_username');
        const savedPassword = localStorage.getItem('tdm_password');
        if (savedUsername) document.getElementById('username').value = savedUsername;
        if (savedPassword) document.getElementById('password').value = savedPassword;
        document.getElementById('loginForm').onsubmit = function() {
            if (document.getElementById('remember').checked) {
                localStorage.setItem('tdm_username', document.getElementById('username').value);
                localStorage.setItem('tdm_password', document.getElementById('password').value);
            } else {
                localStorage.removeItem('tdm_username');
                localStorage.removeItem('tdm_password');
            }
        };
    </script>
</body>
</html>
